schema: 3
identifier: pusht_mouse_topdown_v3
deployment_scope: simulation_only
policy_fps: 10
mujoco_dt: 0.002
substeps: 50
horizon: 300
success_coverage: 0.95
target_pose: [0.34, 0.00, 0.00]
reset:
  development_yaw: 0.0
  block_x: [0.22, 0.30]
  block_y: [-0.10, 0.10]
  final_yaw: [-1.5707963267948966, 1.5707963267948966]
  ee_x: [0.18, 0.38]
  ee_y: [-0.16, 0.16]
  min_block_clearance: 0.08
  max_reset_attempts: 100
observation:
  image: {key: observation.images.topdown, dtype: uint8, shape: [96, 96, 3], layout: HWC}
  state: {key: observation.state, dtype: float32, shape: [15], units: [radians, radians_per_second, metres]}
  joint_order: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]
action:
  key: action
  dtype: float32
  shape: [3]
  units: meters
  meaning: absolute_ee_xyz_target_task_frame
  bounds: {x: [0.18, 0.38], y: [-0.16, 0.16], z: [0.030, 0.100]}
  controller_owned: [orientation, gripper_open]
policy_allowlist: [observation.images.topdown, observation.state, action]
telemetry_schema: [raw_mouse_keyboard, requested_target, ik_target, driver_command, measured_next_state, coverage, ik_diagnostics, timestamp]
safety_envelope:
  contact_z_m: 0.045
  clearance_z_m: 0.065
  max_ee_step_m: 0.015
  joint_soft_limit_margin_rad: 0.05
  joint_command_delta_rad: 1.2
  joint_velocity_rad_s: 1.2
  ik_residual_m: 0.003
  ik_iteration_cap: 64
  contact_force_n: 100.0
  contact_impulse_ns: 4.0
  actuator_limits: 3.35
quotas:
  train: 160
  validation: 20
  test: 20
  strata:
    - initial_yaw_negative_first_contact_left
    - initial_yaw_negative_first_contact_right
    - initial_yaw_positive_first_contact_left
    - initial_yaw_positive_first_contact_right
data:
  pilot_successful_episodes: 20
  accepted_demonstrations: 200
  splits: {train: 160, validation: 20, test: 20}
  training_seeds: [0, 1, 2]
  evaluation_seeds: [100000, 100001, 100002, 100003, 100004, 100005, 100006, 100007, 100008, 100009, 100010, 100011, 100012, 100013, 100014, 100015, 100016, 100017, 100018, 100019, 100020, 100021, 100022, 100023, 100024, 100025, 100026, 100027, 100028, 100029, 100030, 100031, 100032, 100033, 100034, 100035, 100036, 100037, 100038, 100039, 100040, 100041, 100042, 100043, 100044, 100045, 100046, 100047, 100048, 100049, 100050, 100051, 100052, 100053, 100054, 100055, 100056, 100057, 100058, 100059, 100060, 100061, 100062, 100063, 100064, 100065, 100066, 100067, 100068, 100069, 100070, 100071, 100072, 100073, 100074, 100075, 100076, 100077, 100078, 100079, 100080, 100081, 100082, 100083, 100084, 100085, 100086, 100087, 100088, 100089, 100090, 100091, 100092, 100093, 100094, 100095, 100096, 100097, 100098, 100099]
model_protocol:
  batch_size: 64
  max_train_steps: 5000
  num_epochs: 20
  models:
    DP-CNN: {observation_steps: 2, prediction_horizon: 16, executed_actions: 8}
    DP-Transformer: {observation_steps: 2, prediction_horizon: 16, executed_actions: 8}
    IBC: {observation_steps: 2, prediction_horizon: 2, executed_actions: 1}
    LSTM-GMM: {sequence_length: 10, prediction_horizon: 10, executed_actions: 1}
